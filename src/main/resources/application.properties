server.port=${SERVER_PORT:8080}
# MongoDB - credentials are required env vars, no default on purpose (fail fast instead of
# silently connecting with the wrong identity). See README.md for local setup.
spring.data.mongodb.authentication-database=${MONGO_AUTH_DATABASE:admin}
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.database=${MONGO_DATABASE:grigoredb}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.host=${MONGO_HOST:localhost}
logging.level.com.grigore.mongo.service=INFO
logging.file.name=${LOG_FILE:logs/springCRUD.log}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n



app.name=Un fel de memorie
